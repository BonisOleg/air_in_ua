{% load static %}
{% load tz %}
<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Air In UA - Кондиціонери та Сервіс{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <!-- Тут можна додати інші мета-теги або посилання на шрифти, якщо потрібно -->
</head>

<body>

    <header class="site-header">
        <div class="container">
            <a href="{% url 'airinua:index' %}" class="logo">Air In UA</a>
            <nav class="nav">
                <a href="{% url 'airinua:catalog' %}">Каталог</a>
                <a href="{% url 'airinua:services' %}">Послуги</a>
                <a href="{% url 'airinua:about' %}">Про нас</a>
            </nav>
        </div>
    </header>

    <main>
        {% block content %}
        <!-- Сюди буде вставлятись унікальний контент кожної сторінки -->
        {% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; {% now "Y" %} Air In UA. Усі права захищено.</p>
        </div>
    </footer>

    <!-- Кнопка зворотного зв'язку -->
    <button id="feedback-toggle-btn" class="floating-feedback-button" title="Зворотній звʼязок">📞</button>

    <!-- Модальне вікно форми -->
    <div id="feedback-modal" class="modal-overlay" style="display: none;">
        <div class="modal-window">
            {% include 'includes/feedback_form.html' %}
            <button class="modal-close">Закрити</button>
        </div>
    </div>

    <script src="{% static 'js/main.js' %}" defer></script>
    {% block scripts %}
    <!-- Сюди можна додавати специфічні для сторінки скрипти -->
    {% endblock %}
</body>

</html>
